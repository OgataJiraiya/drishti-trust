name: Full-system validation

on:
  pull_request:
  push:
    branches: [main, feat/full-system-integration]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests
      - run: python -m pytest -q tests/model_integrity
      - run: python -m pytest -q tests/distribution_shift
      - run: python -m pytest -q tests/data_integrity
      - run: python -m pytest -q
      - run: python -m compileall -q backend drishti_sdk modules scripts
      - run: python scripts/demo_full_system.py --scenario clean
      - run: python scripts/demo_full_system.py --scenario concern

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        run: npm run build
