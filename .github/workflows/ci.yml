name: Full-system validation

on:
  pull_request:
  push:
    branches: [main, feat/full-system-integration]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements.txt
      - run: python -m pytest -q backend/tests
      - run: python -m pytest -q tests/model_integrity
      - run: python -m pytest -q tests/distribution_shift
      - run: python -m pytest -q tests/data_integrity
      - run: python -m pytest -q
      - run: python -m compileall -q backend drishti_sdk modules scripts
      - run: python scripts/demo_full_system.py --scenario clean
      - run: python scripts/demo_full_system.py --scenario concern
      - name: Validate live evaluator seeding
        env:
          DRISHTI_ADMIN_BEARER_TOKEN: ci-live-evaluator-token
          DRISHTI_DATA_DIR: /tmp/drishti-ci-live/data
          DRISHTI_KEY_DIR: /tmp/drishti-ci-live/keys
        run: |
          set -euo pipefail
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 18801 --log-level warning >/tmp/drishti-ci-live.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python scripts/demo_full_system.py --scenario concern \
            --backend-url http://127.0.0.1:18801 \
            --assessment-id CI-LIVE-CONCERN
          python - <<'PY'
          import os
          from drishti_sdk import DrishtiClient

          with DrishtiClient("http://127.0.0.1:18801", admin_token=os.environ["DRISHTI_ADMIN_BEARER_TOKEN"]) as client:
              summary = client.get_summary("CI-LIVE-CONCERN")
              overall = summary["overall"]
              assert overall["assessment_coverage"] == 1.0
              assert overall["disposition"] == "QUARANTINE"
              assert client.get_assessment("CI-LIVE-CONCERN")["status"] == "SEALED"
          PY

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npm run typecheck
      - working-directory: frontend
        run: npm run lint
      - working-directory: frontend
        run: npm test -- --run
      - working-directory: frontend
        run: npm run build
